[package]
name = "fuji-ptp-android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Protocol core lives in its own repository; enable its serde feature so
# Recipe/Profile serialize to JSON and this bridge stays a thin transport.
fuji-ptp-core = { git = "https://github.com/AlPeFe/fuji-ptp-core", branch = "master", features = ["serde"] }
jni = "0.21"
serde_json = "1"

[workspace]
